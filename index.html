<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
:root{--hi:#ff4fa3;--hi2:#39d0ff;--bg:#0b0b14;--vh:100vh}
html{height:100%;background:#0b0b14}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#2a1440,#0b0b14 60%);color:#eee;font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic","Microsoft JhengHei",sans-serif;height:100vh;height:100dvh;height:var(--vh);display:flex;overflow:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
aside{width:300px;background:#0008;border-right:1px solid #fff1;display:flex;flex-direction:column}
aside h1{font-size:20px;margin:16px;background:linear-gradient(90deg,var(--hi),var(--hi2));-webkit-background-clip:text;color:transparent}
#arts{display:flex;flex-wrap:wrap;gap:6px;margin:0 16px 8px}#arts button{padding:4px 10px;border-radius:14px;border:1px solid #fff3;background:#111;color:#ccc;cursor:pointer;font-size:13px}#arts button.on{background:var(--hi,#e33);color:#000;border-color:transparent}#q{margin:0 16px 10px;padding:10px;border-radius:8px;border:1px solid #fff3;background:#111;color:#fff;font-size:15px}
#list{overflow:auto;flex:1;position:relative;overscroll-behavior:contain}#list div{padding:10px 16px;cursor:pointer;border-left:3px solid transparent}
#list div:hover{background:#fff1}#list div.on{border-color:var(--hi);background:#ff4fa333;font-weight:700;color:#fff}#list div.on::before{content:"▶ ";color:var(--hi)}
#list small{color:#888;display:block;font-weight:400}
main{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0;position:relative}
#pw{width:min(100%,960px);aspect-ratio:16/9;max-height:52vh;background:#000;position:relative;flex:none}#pw #player,#pw iframe{width:100%;height:100%;display:block;border:0}
#bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px;color:#aaa;font-size:14px;justify-content:center}
button,label.btn{background:#222;color:#eee;border:1px solid #fff3;border-radius:6px;padding:5px 10px;cursor:pointer;font-size:14px}
#now{color:#ddd;font-weight:700}
#menuBtn{display:none}
#set{display:none;position:absolute;z-index:20;background:#151525f2;border:1px solid #fff3;border-radius:10px;padding:12px 14px;box-shadow:0 8px 30px #000a;color:#ccc;font-size:14px;line-height:2.4}
#set.open{display:block}#set .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}#set b{display:inline-block;min-width:52px;text-align:center;color:#fff}#set h3{margin:0 0 4px;font-size:14px;color:#fff}
#lyr{flex:1;width:100%;overflow:hidden;position:relative;mask-image:linear-gradient(transparent,#000 20%,#000 80%,transparent);-webkit-mask-image:linear-gradient(transparent,#000 20%,#000 80%,transparent)}
#inner{transition:transform .35s ease;text-align:center;padding:0 12px 60vh}
#inner.nt{transition:none}
.l{font-size:clamp(20px,3.2vw,36px);font-weight:700;margin:.45em 0;color:#fff4;line-height:1.35}
.l.cur{color:transparent;--p:0%;background:linear-gradient(90deg,var(--hi) 0,var(--hi) var(--p),#fff var(--p),#fff 100%);filter:drop-shadow(0 0 8px #0008);-webkit-background-clip:text;background-clip:text;font-size:clamp(24px,4vw,46px);text-shadow:none}
.l.near{color:#fff9}
.l.w.cur{background:none;color:#fff}
.l.w.cur .c{color:transparent;--p:0%;background:linear-gradient(90deg,var(--hi) 0,var(--hi) var(--p),#fff var(--p),#fff 100%);-webkit-background-clip:text;background-clip:text}
#msg{color:#888;text-align:center;margin-top:30px;font-size:20px;position:absolute;top:0;left:0;right:0;padding:0 12px}
/* fullscreen KTV */
#ov,#fsx{display:none}
#pw.fs{position:fixed;top:0;left:0;width:100vw;height:100vh;height:100dvh;height:var(--vh);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);max-height:none;aspect-ratio:auto;z-index:1000;background:#000}
#pw:fullscreen{width:100%;height:100%;max-height:none;aspect-ratio:auto}
#pw.fs #ov{display:block;position:absolute;left:0;right:0;bottom:0;padding:18px calc(4vw + env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) calc(4vw + env(safe-area-inset-left));text-align:center;pointer-events:none;background:linear-gradient(transparent,#000b 35%);z-index:2}
#pw.fs #fsx{display:block;position:absolute;top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));z-index:5;font-size:16px;padding:10px 14px;background:#000a;pointer-events:auto}
#ov .l{margin:.2em 0;text-shadow:0 2px 6px #000,0 0 2px #000}
#ov .l.cur{font-size:clamp(26px,5vw,64px);text-shadow:none;filter:drop-shadow(0 2px 3px #000) drop-shadow(0 0 2px #000)}#ov .l.cur .c{text-shadow:none}
#ov .l.nx{font-size:clamp(18px,3.2vw,40px);color:#fffc}
#ov .l.w.cur .c{filter:none}
@media(max-width:768px){
 body{flex-direction:column}
 #menuBtn{display:inline-block}
 aside{position:fixed;z-index:50;top:0;bottom:0;left:0;width:min(86vw,340px);transform:translateX(-102%);transition:transform .25s;background:#0b0b14f5;box-shadow:4px 0 24px #000a}
 aside.open{transform:none}
 #shade{position:fixed;inset:0;background:#0007;z-index:40;display:none}#shade.open{display:block}
 #list div{padding:14px 16px;min-height:48px}#arts button{padding:8px 14px;font-size:14px}
 main{height:100%;width:100%}
 #pw{width:100%;max-height:none;position:sticky;top:0;z-index:5}
 #bar{padding:6px;gap:6px}#bar button,#bar label.btn{padding:10px 12px;font-size:15px;min-height:44px}
 #now{width:100%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 #set{left:8px!important;right:8px;top:auto}#set button{min-height:44px;min-width:44px}
 #lyr{flex:1;min-height:0}
 .l{font-size:22px}.l.cur{font-size:27px}
}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:2000;background:#1d1d30f5;border:1px solid #fff3;border-radius:10px;padding:8px 12px;color:#eee;font-size:14px;display:none;max-width:94vw;box-shadow:0 6px 24px #000a;align-items:center;gap:8px;flex-wrap:wrap}#toast.show{display:flex}#toast .tx{max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#toast button{padding:4px 9px;font-size:13px}#toast button.on{background:var(--hi);color:#000}
#rp{display:none;position:fixed;z-index:1500;left:50%;top:50%;transform:translate(-50%,-50%);width:min(94vw,560px);max-height:80vh;background:#151525f8;border:1px solid #fff3;border-radius:12px;padding:12px;color:#ccc;font-size:14px;flex-direction:column;box-shadow:0 8px 40px #000c}#rp.open{display:flex}#rp .hd{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}#rp .hd b{flex:1;color:#fff}#rpL{overflow:auto;flex:1}#rpL .it{border-top:1px solid #fff1;padding:6px 0;display:flex;gap:8px}#rpL .it div{flex:1;min-width:0}#rpL .it i{color:#888;font-style:normal;font-size:12px}#rpL input{width:100%;margin-top:3px;background:#111;color:#eee;border:1px solid #fff2;border-radius:5px;padding:4px}
#pw.fs #fsRep{display:block;position:absolute;top:calc(10px + env(safe-area-inset-top));right:calc(150px + env(safe-area-inset-right));z-index:5;font-size:16px;padding:10px 14px;background:#000a}#fsRep{display:none}
button:disabled{opacity:.35;cursor:default}
/* in-player prev/next: icons, tap-to-reveal, idle hide (YouTube iframe is cross-origin — center hit only) */
#ytHit{position:absolute;left:16%;right:16%;top:20%;bottom:30%;z-index:2;background:transparent;cursor:default;pointer-events:auto;-webkit-tap-highlight-color:transparent}
#ytEdgeL,#ytEdgeR{position:absolute;top:28%;bottom:32%;width:min(72px,14%);z-index:2;pointer-events:auto;background:transparent;-webkit-tap-highlight-color:transparent}
#ytEdgeL{left:0}#ytEdgeR{right:0}
#pw.ytShow #ytHit,#pw.ytShow #ytEdgeL,#pw.ytShow #ytEdgeR{pointer-events:none}
#ytNav{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:0 6px;pointer-events:none;opacity:0;transition:opacity .18s ease;visibility:hidden}
#pw.ytShow #ytNav{opacity:1;visibility:visible}
#ytNav .ytNB{pointer-events:none;width:48px;height:48px;min-width:44px;min-height:44px;border-radius:50%;background:#000c;border:1px solid #fff5;color:#fff;font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px #000a;padding:0;flex:none}#ytNav .ytNB svg{display:block;flex:none;pointer-events:none}
#pw.ytShow #ytNav .ytNB{pointer-events:auto}
#pw.fs #ytNav{padding-left:calc(6px + env(safe-area-inset-left));padding-right:calc(6px + env(safe-area-inset-right))}
#pw.fs #ytEdgeL{left:env(safe-area-inset-left)}#pw.fs #ytEdgeR{right:env(safe-area-inset-right)}
@media(max-width:768px){#ytNav .ytNB{width:48px;height:48px}}
#shade{display:none}
html.fsopen,html.fsopen body{overflow:hidden;overscroll-behavior:none}html.fsopen body{position:fixed;inset:0;width:100%}
@media (orientation:landscape) and (max-height:500px){#pw.fs #ov{padding-bottom:calc(10px + env(safe-area-inset-bottom))}#pw.fs #ov .l.cur{font-size:clamp(22px,7vh,44px)}#pw.fs #ov .l.nx{font-size:clamp(16px,5vh,30px)}#pw.fs #fsx,#pw.fs #fsRep{padding:6px 10px;font-size:14px}#pw.fs #fsRep{right:calc(130px + env(safe-area-inset-right))}}
#iosHint{display:none;position:absolute;left:calc(10px + env(safe-area-inset-left));top:calc(62px + env(safe-area-inset-top));z-index:4;background:#1d1d30ee;border:1px solid #fff3;border-radius:8px;padding:6px 8px 6px 12px;color:#eee;font-size:13px;align-items:center;gap:8px;max-width:min(calc(100% - 20px - env(safe-area-inset-left) - env(safe-area-inset-right)),460px);pointer-events:auto}#pw.fs #iosHint.show{display:flex}#iosHint button{padding:2px 8px;font-size:13px}
@media (display-mode:standalone),(display-mode:fullscreen){#iosHint{display:none!important}}
/* closefix */
.xb{white-space:nowrap;flex:none}.sideHd{display:flex;align-items:center;justify-content:space-between;gap:6px;padding-right:10px;padding-top:env(safe-area-inset-top)}#sideX{display:none}
@media (max-width:768px){#sideX{display:inline-block;min-height:40px}}
#set .sh{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:-12px;background:#151525;margin:-12px -14px 4px;padding:8px 14px;z-index:1}#set .sh h3{margin:0}
#set{max-height:calc(var(--vh) - 90px);overflow:auto;overscroll-behavior:contain}
#rpBg{display:none;position:fixed;inset:0;z-index:1499;background:#0008}#rpBg.open{display:block}
#rp{max-height:calc(var(--vh) - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom))!important;overflow:hidden}
#rp .hd{position:sticky;top:0;flex:none}#rpL{min-height:0;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#rp .hd button{min-height:40px}#toast #tX{background:#333}

/* furigana ruby (lemon pilot) */
.l ruby.rb{ruby-position:over;-webkit-ruby-position:over;ruby-align:center}
.l rt{font-size:.42em;font-weight:600;color:#c8c8d8;line-height:1.05;user-select:none;pointer-events:none;text-shadow:none;letter-spacing:0}
.l.w{line-height:1.7;padding-top:.15em}
.l.w.cur{line-height:1.75}
#ov .l{line-height:1.55;padding-top:.2em}
#ov .l rt{font-size:.38em;color:#ddd;filter:none;text-shadow:0 1px 2px #000a}
/* progressive rt fill (synced to base span): 米津/YOASOBI/優里/嵐/Vaundy/ONE OK ROCK */
.l.w.cur ruby.rb.rtf rt{color:transparent;--rp:0%;background:linear-gradient(90deg,var(--hi) 0,var(--hi) var(--rp),#c8c8d8 var(--rp),#c8c8d8 100%);-webkit-background-clip:text;background-clip:text;text-shadow:none}
#ov .l.w.cur ruby.rb.rtf rt{color:transparent;--rp:0%;background:linear-gradient(90deg,var(--hi) 0,var(--hi) var(--rp),#ddd var(--rp),#ddd 100%);-webkit-background-clip:text;background-clip:text;filter:none;text-shadow:none}

@media(max-width:768px){.l.w{line-height:1.65}.l rt{font-size:.4em}#ov .l rt{font-size:.36em}}
@media(orientation:landscape) and (max-height:500px){#ov .l{line-height:1.35;padding-top:.1em}#ov .l rt{font-size:.34em}}


/* lyric click-to-seek */
#inner .l{cursor:pointer;-webkit-tap-highlight-color:transparent}
#inner .l:hover{color:#fffc}
/* FS lyric overlay above #ytHit so taps seek instead of nav-reveal; children none = solid hit box */
#pw.fs #ov{pointer-events:none;z-index:4}
#pw.fs #ov .l{pointer-events:auto;cursor:pointer;-webkit-tap-highlight-color:transparent}
#pw.fs #ov .l *{pointer-events:none}

/* JPOP home */
#home{display:none;position:fixed;inset:0;z-index:60;background:radial-gradient(circle at 30% 0,#2a1440,#0b0b14 55%);overflow:auto;padding:calc(24px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));}
#home.show{display:block}
#home .wrap{max-width:960px;margin:0 auto}
#home h1{font-size:clamp(32px,8vw,56px);margin:8px 0 6px;background:linear-gradient(90deg,var(--hi),var(--hi2));-webkit-background-clip:text;color:transparent;text-align:center;font-weight:800;letter-spacing:.04em}
#home .sub{text-align:center;color:#aaa;margin:0 0 28px;font-size:15px}
#homeCards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(max-width:719px){#homeCards .acard:last-child:nth-child(odd){grid-column:span 2}}
@media(min-width:720px){#homeCards{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}}
.acard{position:relative;border:1px solid #fff2;border-radius:16px;overflow:hidden;cursor:pointer;background:#111a;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;box-shadow:0 8px 28px #0006;transition:transform .15s,border-color .15s,box-shadow .15s;-webkit-tap-highlight-color:transparent}
.acard:hover,.acard:focus-visible{transform:translateY(-2px);border-color:var(--ac,#ff4fa3);box-shadow:0 12px 32px #000a;outline:none}
.acard .thumb{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.35;filter:saturate(1.1)}
.acard .shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 20%,#000d 85%)}
.acard .meta{position:relative;z-index:1}
.acard .an{font-size:clamp(18px,3.5vw,22px);font-weight:800;color:#fff}
.acard .ac{font-size:13px;color:#ccc;margin-top:4px}
.acard .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ac);margin-right:6px;vertical-align:middle;box-shadow:0 0 8px var(--ac)}
aside h1{cursor:pointer}aside h1:hover{filter:brightness(1.15)}
#homeBtn{display:none;margin:0 16px 8px;padding:8px 12px;border-radius:8px;border:1px solid #fff3;background:#111;color:#ddd;cursor:pointer;font-size:13px;text-align:left}
@media(max-width:768px){#homeBtn{display:block;min-height:44px}}

/* singing score v2 */
#scoreLab{display:none}
#scoreUI{display:none;position:relative;width:min(100%,960px);padding:6px 10px 8px;color:#ddd;font-size:13px}
#scoreUI.on{display:block}
#scoreHint{color:#bbb;font-size:12px;margin:0 0 4px}
#scoreRibbon{width:100%;height:76px;display:block;background:#0007;border:1px solid #fff2;border-radius:8px;contain:strict}
#scoreLive{display:flex;gap:12px;flex-wrap:wrap;align-items:baseline;margin-top:4px;color:#ccc;font-variant-numeric:tabular-nums}
#scoreLive b{color:#fff;font-size:16px}#scoreLive .tc{color:#ffd166}#scoreLive .last{color:#888}
#scoreBadges{position:absolute;right:16px;top:6px;height:0;pointer-events:none;z-index:2}
.sbadge{position:absolute;right:0;white-space:nowrap;padding:2px 9px;border-radius:12px;background:#ff4fa3e6;color:#fff;font-size:13px;font-weight:700;box-shadow:0 2px 10px #0008;animation:sbUp 1.3s ease-out forwards;will-change:transform,opacity}
.sbadge.vib{background:#7c5cffe6}.sbadge.run{background:#ff8a3de6}.sbadge.long{background:#2fbf71e6}.sbadge.fall{background:#3a8bffe6}.sbadge.kob{background:#e0a100e6}
@keyframes sbUp{0%{transform:translateY(18px);opacity:0}15%{transform:translateY(0);opacity:1}75%{opacity:1}100%{transform:translateY(-22px);opacity:0}}
#scoreMsg{display:none;position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:2100;background:#1d1d30f5;border:1px solid #fff3;border-radius:10px;padding:8px 12px;color:#eee;font-size:14px;max-width:94vw;box-shadow:0 6px 24px #000a}
#scoreMsg.show{display:block}
#scoreEnd{display:none;position:fixed;z-index:1600;left:50%;top:50%;transform:translate(-50%,-50%);width:min(94vw,380px);max-height:calc(var(--vh,100vh) - 24px);overflow:auto;background:#151525f8;border:1px solid #fff3;border-radius:12px;padding:14px 16px;color:#ccc;font-size:14px;box-shadow:0 8px 40px #000c;flex-direction:column;gap:6px}
#scoreEnd.open{display:flex}
#scoreEnd .hd{display:flex;align-items:center;gap:8px}#scoreEnd .hd b{flex:1;color:#fff;font-size:16px}
#scoreEndBig{font-size:56px;font-weight:800;text-align:center;background:linear-gradient(90deg,var(--hi),var(--hi2));-webkit-background-clip:text;color:transparent;line-height:1.1;padding:4px 0 0}
#scoreEndSub{text-align:center;color:#aaa;font-size:13px}
#scoreEndWarn{display:none;text-align:center;color:#ffd166;font-size:13px}#scoreEndWarn.show{display:block}
#scoreEndTbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}#scoreEndTbl td{padding:3px 4px;border-top:1px solid #fff1}#scoreEndTbl td:last-child{text-align:right;color:#fff}
#scoreEndTbl tr.sec td{color:#888;font-size:12px;border-top:0;padding-top:8px}
#scoreEndNext{display:none;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:4px}#scoreEndNext.show{display:flex}
#scoreEnd .nt{margin:4px 0 0;color:#888;font-size:12px;text-align:center}
#pw.fs #scoreUI.on{position:absolute;top:calc(48px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(72vw,560px);z-index:6;pointer-events:none;background:#0009;border-radius:10px;padding:6px 8px}
#pw.fs #scoreUI #scoreHint{display:none}
#pw.fs #scoreRibbon{height:64px}
#pw.fs #scoreEnd.open{position:absolute;z-index:8}
@media(max-width:768px){#scoreRibbon{height:64px}#pw.fs #scoreUI.on{width:min(88vw,560px);top:calc(52px + env(safe-area-inset-top))}}
@media(orientation:landscape) and (max-height:500px){#pw.fs #scoreUI.on{top:calc(40px + env(safe-area-inset-top));width:min(56vw,480px);padding:3px 6px}#pw.fs #scoreRibbon{height:44px}#pw.fs #scoreLive{font-size:12px;margin-top:2px}#pw.fs #scoreLive b{font-size:14px}}

</style></head><body>
<div id="home" aria-label="JPOP 首頁"><div class="wrap"><h1>JPOP</h1><p class="sub">選一位歌手開始 · KTV 歌詞</p><div id="homeCards"></div></div></div>
<div id="shade"></div>
