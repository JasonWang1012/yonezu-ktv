const $=s=>document.querySelector(s);
function parseLRC(t){const out=[];for(const raw of t.split(/\r?\n/)){const tags=[...raw.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)];if(!tags.length)continue;const txt=raw.replace(/\[[^\]]*\]/g,'').trim();for(const m of tags)out.push({t:+m[1]*60+ +m[2],txt})}return out.sort((a,b)=>a.t-b.t)}
function renderList(){const q=$('#q').value.toLowerCase();$('#list').innerHTML='';songs.filter(s=>(s.title+s.ytTitle).toLowerCase().includes(q)).forEach(s=>{const d=document.createElement('div');d.innerHTML=`${s.title}<small>${s.lyrics?'♪ 有歌詞':'無同步歌詞'}</small>`;if(cur&&cur.id==s.id)d.className='on';d.onclick=()=>pick(s);$('#list').append(d)})}
function setLines(l,tm){tmode=!!tm;if(cur)loadOff();if(tm)l=tm.lines.map(x=>({t:x.t,e:x.e,txt:x.chars.map(c=>c.c).join(''),chars:x.chars}));lines=l;lastIdx=-2;$('#inner').innerHTML=l.map((x,i)=>x.chars?`<div class="l w" id="L${i}">${x.chars.map((c,j)=>`<span class="c" id="C${i}_${j}">${esc(c.c)}</span>`).join('')}</div>`:`<div class="l" id="L${i}">${x.txt?esc(x.txt):'♪'}</div>`).join('');$('#msg').textContent=l.length?'':'（此曲無同步歌詞，可按「載入 .lrc」自行加入）';$('#inner').style.transform=''}
async function pick(s){cur=s;renderList();$('#now').textContent=s.title;scale=+(localStorage['sc_'+s.id]||1);$('#sc').textContent=(scale*100).toFixed(1)+'%';
 if(ready)player.loadVideoById(s.videoId);
 const custom=localStorage['lrc_'+s.id];let txt=custom||(window.LRC&&LRC[s.id])||null;
 if(!txt&&s.lyrics){try{txt=await (await fetch('lyrics/'+s.id+'.lrc')).text()}catch(e){}}
 let tm=null;if(!custom){tm=(window.TIMINGS&&TIMINGS[s.id])||null;if(!tm&&!window.LRC&&s.lyrics){try{const r=await fetch('timings/'+s.id+'.json');if(r.ok)tm=await r.json()}catch(e){}}}
 if(cur!==s)return;setLines(txt?parseLRC(txt):[],tm)}
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{if(!cur)return;const d=+b.dataset.d;offset=d?Math.round((offset+d)*10)/10:0;localStorage[offKey()]=offset;$('#off').textContent=offset.toFixed(1)});
$('#file').onchange=async e=>{const f=e.target.files[0];if(!f||!cur)return;const t=await f.text();localStorage['lrc_'+cur.id]=t;setLines(parseLRC(t),null);e.target.value=''};
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{if(!cur)return;const d=+b.dataset.s;scale=d?Math.round((scale+d)*1000)/1000:1;localStorage['sc_'+cur.id]=scale;$('#sc').textContent=(scale*100).toFixed(1)+'%'});
$('#q').oninput=renderList;
function tick(){if(ready&&lines.length&&player.getCurrentTime){const t=player.getCurrentTime()*scale+offset;const lead=tmode?0.3:0;let i=-1;for(let k=0;k<lines.length;k++){if(lines[k].t-lead<=t)i=k;else break}
 if(i!==lastIdx){document.querySelectorAll('.l.cur,.l.near').forEach(e=>e.classList.remove('cur','near'));if(i>=0){const el=$('#L'+i);el.classList.add('cur');[i-1,i+1].forEach(j=>{const n=$('#L'+j);n&&n.classList.add('near')});$('#inner').style.transform=`translateY(${-(el.offsetTop-$('#lyr').clientHeight/2+el.offsetHeight/2)+0}px)`;$('#inner').style.paddingTop='0';}lastIdx=i}
 if(i>=0&&tmode){const L=lines[i];L.chars.forEach((c,j)=>{const p=t>=c.e?100:t<=c.s?0:(t-c.s)/Math.max(0.01,c.e-c.s)*100;const r=Math.round(p);if(c._p!==r){c._p=r;$('#C'+i+'_'+j).style.setProperty('--p',r+'%')}})}
 else if(i>=0){const st=lines[i].t,en=i+1<lines.length?lines[i+1].t:st+5,gap=en-st,dur=Math.max(0.6,gap<=8?gap*0.92:Math.min(gap,Math.max(2,(lines[i].txt||'').length*0.3)));const p=Math.max(0,Math.min(1,(t-st)/dur));$('#L'+i).style.setProperty('--p',(p*100).toFixed(1)+'%')}}
 requestAnimationFrame(tick)}
window.onYouTubeIframeAPIReady=()=>{player=new YT.Player('player',{playerVars:{rel:0,playsinline:1},events:{onReady:()=>{ready=true;if(cur)player.loadVideoById(cur.videoId)},onError:e=>{$('#msg').innerHTML=`影片無法嵌入播放（錯誤 ${e.data}）— <a style="color:#39d0ff" target="_blank" href="https://www.youtube.com/watch?v=${cur.videoId}">在 YouTube 開啟</a>`}}})};
(async()=>{if(!songs.length)songs=await (await fetch('songs.json')).json();renderList();requestAnimationFrame(tick)})();
</script><script src="https://www.youtube.com/iframe_api"></script>
</body></html>
