<style>

}

#pw.fs #fsRep{display:block;position:absolute;top:calc(10px + env(safe-area-inset-top));right:calc(150px + env(safe-area-inset-right));z-index:3;font-size:16px;padding:10px 14px;background:#000a}#fsRep{display:none}

#ytHit{position:absolute;left:16%;right:16%;top:20%;bottom:30%;z-index:2;background:transparent;cursor:default;pointer-events:auto;-webkit-tap-highlight-color:transparent}
#ytEdgeL,#ytEdgeR{position:absolute;top:28%;bottom:32%;width:min(72px,14%);z-index:2;pointer-events:auto;background:transparent;-webkit-tap-highlight-color:transparent}

#pw.ytShow #ytHit,#pw.ytShow #ytEdgeL,#pw.ytShow #ytEdgeR{pointer-events:none}
#ytNav{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:0 6px;pointer-events:none;opacity:0;transition:opacity .18s ease;visibility:hidden}
#pw.ytShow #ytNav{opacity:1;visibility:visible}
#ytNav .ytNB{pointer-events:none;width:48px;height:48px;min-width:44px;min-height:44px;border-radius:50%;background:#000c;border:1px solid #fff5;color:#fff;font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px #000a;padding:0;flex:none}#ytNav .ytNB svg{display:block;flex:none;pointer-events:none}
#pw.ytShow #ytNav .ytNB{pointer-events:auto}

#pw.fs #ytEdgeL{left:env(safe-area-inset-left)}#pw.fs #ytEdgeR{right:env(safe-area-inset-right)}

 if(i!==lastIdx){show(i);lastIdx=i}
 const ov=pw.classList.contains('fs');
 if(i>=0&&tmode){const L=lines[i];L.chars.forEach((c,j)=>{const p=t>=c.e?100:t<=c.s?0:(t-c.s)/Math.max(0.01,c.e-c.s)*100;const r=Math.round(p);if(c._p!==r){c._p=r;$('#C'+i+'_'+j).style.setProperty('--p',r+'%')}if(ov){const o=document.getElementById('O_'+j);o&&o.style.setProperty('--p',r+'%')}});if(rubyRtFill&&rubyLines&&rubyLines[i]){for(const sp of rubyLines[i]){const a=L.chars[sp.o],b=L.chars[sp.o+sp.l-1];if(!a||!b)continue;const p=t>=b.e?100:t<=a.s?0:(t-a.s)/Math.max(0.01,b.e-a.s)*100;const r=Math.round(p);if(sp._rp!==r){sp._rp=r;const el=$('#R'+i+'_'+sp.o);el&&el.style.setProperty('--rp',r+'%');if(ov){const o=document.getElementById('OR_'+sp.o);o&&o.style.setProperty('--rp',r+'%')}}}}}
 else if(i>=0){const st=lines[i].t,en=i+1<lines.length?lines[i+1].t:st+5,gap=en-st,dur=Math.max(0.6,gap<=8?gap*0.92:Math.min(gap,Math.max(2,(lines[i].txt||'').length*0.3)));const p=Math.max(0,Math.min(1,(t-st)/dur)),v=(p*100).toFixed(1)+'%';$('#L'+i).style.setProperty('--p',v);if(ov){const o=$('#OL');o&&o.style.setProperty('--p',v)}}}
 requestAnimationFrame(tick)}
window.onYouTubeIframeAPIReady=()=>{player=new YT.Player('player',{playerVars:{rel:0,playsinline:1,fs:0},events:{onStateChange:e=>{if(e.data===1||e.data===2)started=true;if(e.data===1)errRun=0;if(e.data===0&&cur&&$('#auto').checked&&!isAd()){let d=0,c=0;try{d=player.getDuration();c=player.getCurrentTime()}catch(x){}if(!d||c>d-8)playNext()}},onReady:()=>{ready=true;try{const f=player.getIframe();f.removeAttribute('allowfullscreen');f.allow=(f.getAttribute('allow')||'').split(';').map(x=>x.trim()).filter(x=>x&&!/^fullscreen/.test(x)).join('; ')}catch(x){}if(cur)player.loadVideoById(cur.videoId)},onError:e=>{if(!cur)return;if($('#auto').checked&&errRun<songs.length){errRun++;setTimeout(playNext,1500)}$('#msg').innerHTML=`影片無法嵌入播放（錯誤 ${e.data}）— <a style="color:#39d0ff" target="_blank" href="https://www.youtube.com/watch?v=${cur.videoId}">在 YouTube 開啟</a>`}}})};

// ---- 回報不準 (client-side, localStorage ktvReports; cleared only manually) ----
const RK='ktvReports';let memReps=null;
function getReps(){if(memReps)return memReps;try{const a=JSON.parse(localStorage.getItem(RK)||'[]');return Array.isArray(a)?a:[]}catch(e){return []}}
function saveReps(a){try{localStorage.setItem(RK,JSON.stringify(a));memReps=null;return true}catch(e){memReps=a;return false}}
const fmtT=x=>{x=Math.max(0,x||0);const m=Math.floor(x/60),s=x-m*60;return String(m).padStart(2,'0')+':'+s.toFixed(1).padStart(4,'0')};
const pad2=n=>String(n).padStart(2,'0');
const fmtD=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
let toastT=0,lastRep=null;
function updN(){$('#rpN').textContent=getReps().length}
function toast(r,warn){const t=$('#toast');const host=pw.classList.contains('fs')?pw:document.body;if(t.parentNode!==host)host.append(t);t.querySelector('.tx').textContent=(warn?'⚠ 無法永久儲存（僅此次開啟有效）：':'已記錄：')+r.title+' '+r.time+'「'+(r.line||'—')+'」';t.querySelectorAll('[data-tag]').forEach(b=>b.classList.toggle('on',r.tag===b.dataset.tag));t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),5000)}
function report(){if(!cur){alert('請先選擇歌曲');return}
 let pt=0;try{pt=player&&player.getCurrentTime?+player.getCurrentTime()||0:0}catch(e){}
 const idx=lastIdx>=0?lastIdx:-1,L=i=>i>=0&&lines[i]?(lines[i].txt||'♪'):'';const now=Date.now();
 if(lastRep&&lastRep.id===cur.id&&lastRep.idx===idx&&now-lastRep.ts<2000){toast(lastRep);return}
 const r={ts:now,local:fmtD(new Date(now)),id:cur.id,title:cur.title,artist:cur.artist||'米津玄師',videoId:cur.videoId,sec:Math.round(pt*10)/10,time:fmtT(pt),lyricT:Math.round((pt*scale+offset)*100)/100,idx,line:L(idx),prev:L(idx-1),next:idx>=0?L(idx+1):L(0),offset,speed:scale,mode:tmode?'逐字':'LRC',ad:lastIdx===-3,ver:window.KTV_VER||document.querySelector('meta[name=version]')?.content||null,tag:'',note:''};
 const a=getReps();a.push(r);const ok=saveReps(a);lastRep=r;updN();toast(r,!ok);if($('#rp').classList.contains('open'))renderReps()}
function mutate(ts,f){const a=getReps(),i=a.findIndex(x=>x.ts===ts);if(i<0)return;f(a,i);saveReps(a);updN()}
$('#tUndo').onclick=e=>{e.stopPropagation();if(lastRep){mutate(lastRep.ts,(a,i)=>a.splice(i,1));lastRep=null}$('#toast').classList.remove('show');if($('#rp').classList.contains('open'))renderReps()};
$('#toast').querySelectorAll('[data-tag]').forEach(b=>b.onclick=e=>{e.stopPropagation();if(!lastRep)return;const tg=lastRep.tag===b.dataset.tag?'':b.dataset.tag;lastRep.tag=tg;mutate(lastRep.ts,(a,i)=>a[i].tag=tg);toast(lastRep);if($('#rp').classList.contains('open'))renderReps()});
function repText(){const a=getReps();const out=[`KTV 回報不準 共 ${a.length} 筆（複製於 ${fmtD(new Date())}）`];
 a.forEach((r,k)=>out.push(`#${k+1} ${r.title} (id: ${r.id}) / ${r.artist} / 影片時間 ${r.time} (${(+r.sec).toFixed(1)}s) / 歌詞時間 ${(+r.lyricT).toFixed(2)}s / `+(r.idx>=0?`第${r.idx+1}行「${r.line}」`:(r.ad?'廣告中':'尚未開始唱'))+` / 前一行「${r.prev||'—'}」 / 下一行「${r.next||'—'}」 / 偏移 ${(+r.offset).toFixed(1)}s / 速度 ${(r.speed*100).toFixed(1)}% / 模式 ${r.mode}`+(r.tag?` / 標記 ${r.tag}`:'')+(r.note?` / 備註 ${r.note}`:'')+` / 記錄於 ${r.local}`+(r.ver?` / 版本 ${r.ver}`:'')));return out.join('\n')}
window.repText=repText;
async function copyText(t){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t);return true}}catch(e){}
 try{const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.append(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok}catch(e){return false}}
function renderReps(){const a=getReps().slice().reverse(),L=$('#rpL');updN();
 L.innerHTML=a.length?'':'<div style="padding:10px;color:#888">尚無回報</div>';
 a.forEach(r=>{const d=document.createElement('div');d.className='it';d.innerHTML=`<div><b>${esc(r.title)}</b> ${r.time}${r.tag?' <span style="color:var(--hi)">'+esc(r.tag)+'</span>':''}<br>${r.idx>=0?'第'+(r.idx+1)+'行「'+esc(r.line)+'」':'（無歌詞行）'}<br><i>${esc(r.artist)} · 偏移 ${(+r.offset).toFixed(1)}s · 速度 ${(r.speed*100).toFixed(1)}% · ${r.local}</i><input placeholder="備註（選填）" maxlength="80"></div><button title="刪除">✕</button>`;
  const inp=d.querySelector('input');inp.value=r.note||'';inp.onchange=()=>mutate(r.ts,(x,i)=>x[i].note=inp.value.trim());
  d.querySelector('button').onclick=()=>{mutate(r.ts,(x,i)=>x.splice(i,1));if(lastRep&&lastRep.ts===r.ts)lastRep=null;renderReps()};L.append(d)})}
document.querySelectorAll('.repBtn').forEach(b=>b.onclick=e=>{e.stopPropagation();report()});
function rpOpen(o){const h=pw.classList.contains('fs')?pw:document.body;['#rpBg','#rp'].forEach(q=>{const e=$(q);if(o&&e.parentNode!==h)h.append(e);e.classList.toggle('open',o)})}window.rpOpen=rpOpen;
$('#rpBtn').onclick=e=>{e.stopPropagation();renderReps();rpOpen(true)};
$('#rpX').onclick=e=>{e.stopPropagation();rpOpen(false)};$('#rpBg').onclick=e=>{e.stopPropagation();rpOpen(false)};
$('#tX').onclick=e=>{e.stopPropagation();clearTimeout(toastT);$('#toast').classList.remove('show')};
$('#setX').onclick=e=>{e.stopPropagation();$('#set').classList.remove('open')};$('#sideX').onclick=()=>drawer(false);$('#rp').onclick=e=>e.stopPropagation();
$('#rpCopy').onclick=async()=>{const ok=await copyText(repText());const b=$('#rpCopy');b.textContent=ok?'已複製 ✓':'複製失敗';setTimeout(()=>b.textContent='複製全部',1800)};
$('#rpClr').onclick=()=>{const n=getReps().length;if(!n)return;if(confirm(`確定清空全部 ${n} 筆回報？此動作無法復原。`)){saveReps([]);lastRep=null;renderReps()}};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){rpOpen(false);clearTimeout(toastT);$('#toast').classList.remove('show')}});
updN();
(async()=>{if(!songs.length)songs=await (await fetch('songs.json')).json();renderList();renderArts();renderList();requestAnimationFrame(tick)})();
</script><script src="https://www.youtube.com/iframe_api"></script>
